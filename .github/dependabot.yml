version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dependabot's npm updater cannot authenticate the public JSR alias at
    # npm.jsr.io. Review this pinned wallet-kit release manually on JSR.
    ignore:
      - dependency-name: "@creit-tech/stellar-wallets-kit"
  - package-ecosystem: cargo
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
