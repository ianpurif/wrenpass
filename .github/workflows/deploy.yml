name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Vercel environment to deploy
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read
  deployments: write

concurrency:
  group: vercel-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }} with Vercel build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Restrict production deployments to main
        if: ${{ inputs.target == 'production' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Production deployments must run from main."
          exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.16.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate deployment credentials
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
      - name: Pull Vercel project settings
        run: pnpm dlx vercel@58.9.0 pull --yes --environment=${{ inputs.target }} --token="$VERCEL_TOKEN"
      - name: Deploy preview
        if: ${{ inputs.target == 'preview' }}
        run: pnpm dlx vercel@58.9.0 deploy --yes --archive=tgz --token="$VERCEL_TOKEN"
      - name: Deploy production
        if: ${{ inputs.target == 'production' }}
        run: pnpm dlx vercel@58.9.0 deploy --yes --archive=tgz --prod --token="$VERCEL_TOKEN"
